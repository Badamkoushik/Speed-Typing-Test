<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>
    <link rel = "stylesheet" href = "index.css"/>
</head>

<body>
    <div class="d-none" id="spinner">
        <div class="d-flex justify-content-center">
            <div class="spinner-border" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
    </div>
    <div class="bg-container" id="speedTypingTest">
        <h1 class="heading-container pl-4 pt-4">Speed Typing Test</h1>
        <p class="pl-4 pt-2">On your fingers lets set Go!</p>
        <div class="d-flex flex-row pl-4">
            <img src="https://assets.ccbp.in/frontend/dynamic-webapps/clock-img.png" class="image-element" />
            <p id="timer" class="timer-element"></p>
        </div>
        <div class="container-second m-4">
            <p id="quoteDisplay" class="pl-4 pt-4"></p>
            <div class="text-center pt-3 pb-3">
                <textarea rows="5" cols="30" placeholder="Type here!!" id="quoteInput"></textarea>
            </div>
        </div>
        <p id="result" class="pl-4"></p>
        <button class="submit-button ml-4 mt-4" id="submitBtn">Submit</button>
        <button class="reset-button ml-2" id="resetBtn">Reset</button>
    </div>
    <script src="index.js"></script>
</body>

</html>
